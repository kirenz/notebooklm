project:
  type: website

execute:
  freeze: auto

website:
  page-navigation: true
  title: "NotebookLM"
  description: "NotebookLM Workshop"
  image: "/images/logo.png"
  favicon: "/images/logo.png"
  search:
    type: overlay  
  page-footer:
    left: |
      © [Jan Kirenz](https://www.kirenz.de/), 2025
  navbar:
    left:
      - href: index.qmd
        text: Home     
      - href: agenda.qmd            
      - href: features.qmd
      - href: exercises.qmd      
      - href: use-cases.qmd
      - href: use-cases-domains.qmd
   
lang: en 

format:
  html:
    toc: true
    theme: [flatly, custom-website.scss]
    css: custom-website.scss
    code-copy: true
    highlight-style: atom-one
    code-overflow: wrap
    author-meta: "Jan Kirenz"
    callout-appearance: simple
    smooth-scroll: true
    anchor-sections: true
    code-fold: false
    code-tools: false
    include-in-header:
      - text: |
          <script src="password.js"></script>
          <meta name="viewport" content="width=device-width, initial-scale=1.0">
          <link rel="preconnect" href="https://fonts.googleapis.com">
          <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>